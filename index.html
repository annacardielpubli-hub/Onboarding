<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuéntanos de tu negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2A21D9;--ink:#14123A;--paper:#fff;--mut:rgba(255,255,255,.76);--line:rgba(255,255,255,.35);--sun:#FFD84D;--err:#FFB4A8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font:400 19px/1.5 "DM Sans",system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;height:6px;width:0;background:var(--sun);transition:width .4s ease}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 28px;font:800 20px "Bricolage Grotesque",system-ui,sans-serif}
#cnt{font:500 15px "DM Sans",sans-serif;color:var(--mut)}
#stage{height:100%;display:flex;overflow-y:auto;padding:84px 24px 60px}
.q{width:100%;max-width:700px;margin:auto;animation:in .4s ease both}
.q.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.sec{color:var(--sun);font-weight:700;font-size:16px;margin-bottom:14px}
.opt-tag{margin-left:12px;color:var(--mut);font-weight:400}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;line-height:1.12;margin:0 0 24px;letter-spacing:-.01em}
h1{font-size:clamp(34px,6.4vw,58px)}
h2{font-size:clamp(28px,5vw,44px)}
.hint{color:var(--mut);font-size:18px;margin:-12px 0 24px;max-width:58ch}
.hint:empty{display:none}
.hint b{color:var(--paper);font-weight:700}
.hint a{color:var(--sun)}
input,textarea{width:100%;font:inherit;font-size:clamp(20px,3.2vw,28px);color:var(--paper);background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px 0;outline:0;resize:none;transition:border-color .2s}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.5)}
input:focus,textarea:focus{border-color:var(--sun)}
#oth{margin-top:14px;font-size:21px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;font-size:19px;color:var(--paper);background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--paper)}
.opt kbd{font:700 13px "DM Sans",sans-serif;min-width:26px;text-align:center;border:1.5px solid currentColor;border-radius:6px;padding:1px 0}
.opt.on{background:var(--sun);border-color:var(--sun);color:var(--ink);font-weight:500}
.opt:focus-visible,.btn:focus-visible,.ghost:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.row{display:flex;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn,.ghost{font:700 18px "DM Sans",sans-serif;border-radius:10px;padding:13px 26px;cursor:pointer}
.btn{color:var(--ink);background:var(--sun);border:2px solid var(--sun)}
.btn:hover{filter:brightness(.93)}
.ghost{color:var(--paper);background:transparent;border:2px solid var(--line)}
.ghost:hover{border-color:var(--paper)}
.hk{color:var(--mut);font-size:15px}
.err{color:var(--err);font-size:17px;margin-top:14px;min-height:1.4em}
.bg i{position:fixed;border-radius:50%;background:var(--sun);opacity:.14;animation:float 16s ease-in-out infinite}
.bg i:nth-child(1){width:260px;height:260px;top:-80px;right:-60px}
.bg i:nth-child(2){width:180px;height:180px;bottom:8%;left:-60px;animation-delay:-5s;background:#fff;opacity:.08}
.bg i:nth-child(3){width:120px;height:120px;top:55%;right:12%;animation-delay:-9s}
@keyframes float{50%{transform:translate(18px,-26px) scale(1.06)}}
#stage{position:relative;z-index:1}
header{z-index:2}
#bar{z-index:3}
#bar::after{content:"🚀";position:absolute;right:-14px;top:-9px;font-size:18px;transform:rotate(45deg)}
.emo{display:block;width:fit-content;font-size:68px;line-height:1;margin-bottom:14px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-7deg)}}
.gif{display:block;max-width:min(280px,70%);border-radius:14px;margin-bottom:20px}
.done{display:block;width:fit-content;margin-bottom:18px;padding:5px 16px;border-radius:99px;background:var(--sun);color:var(--ink);font-weight:700;font-size:16px;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.rot{display:inline-grid;overflow:hidden;vertical-align:bottom;color:var(--sun);padding:.04em 0 .14em;margin-bottom:-.14em}
.rw{grid-area:1/1;opacity:0;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.rw.on{opacity:1;transform:none}
.rw.out{opacity:0;transform:translateY(-100%)}
.fine{color:var(--mut);font-size:14px;margin:22px 0 0;max-width:60ch}
.q.intro{animation-name:zoom}
@keyframes zoom{from{opacity:0;transform:scale(.94)}}
.opt{animation:in .35s ease backwards;animation-delay:calc(var(--d,0)*60ms);transition:background .15s,border-color .15s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.opt.on{transform:scale(1.02)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="bar"></div>
<header><span id="brand"></span><span id="cnt"></span></header>
<main id="stage"></main>
<script>
// Ajustes: copia aquí tus datos (nombre, dirección de Google Sheets y datos legales)
const CONFIG={agency:"La Sobremesa Studio",endpoint:"https://script.google.com/macros/s/AKfycbyVL0HXXleybvA1YSd3qMe-MS9OaZNgl8X1qPkTvztknKvoKrrsL7Pr3b0jD2eWbg3wJw/exec",
  legal:{responsable:"La Sobremesa Studio",email:"Studio@lasobremesa.com",politicaUrl:""}};
const L=CONFIG.legal,KEY="onboarding-v2";
// GIFs propios (opcional): sube el archivo al repositorio y escribe su nombre. Claves: welcome, 0 a 7 (fases) y thanks
// Ejemplo: const GIFS={welcome:"hola.gif",3:"cliente.gif"};  Si una clave no está, se muestra un emoji animado.
const GIFS={};
// Palabras que van cambiando en la primera pantalla: "15 minutos para empezar a ganar ..."
const PALABRAS=["clientes","visibilidad","reconocimiento","ventas","autoridad","confianza","posicionamiento"];
const E=['🙋','🏢','🎯','👥','🎨','🌐','🤝','🚀'];
const art=(k,e)=>GIFS[k]?`<img class="gif" src="${GIFS[k]}" alt="">`:`<div class="emo">${e}</div>`;

// Fases: [nombre, minutos, por qué lo preguntamos]
const P=[
['Empecemos por conocerte',1,'Para saber con quién hablamos y cómo escribirte.'],
['Tu negocio',2,'Antes de hablar de redes o anuncios, queremos entender qué haces y qué te hace especial.'],
['Lo que quieres conseguir',2,'Esto nos dice hacia dónde vamos. Sin una meta clara, ni el mejor contenido sirve de mucho.'],
['Define a tu cliente tipo',3,'Vamos a dibujar, paso a paso, a la persona promedio que consume tu producto o servicio. Piensa en tus mejores clientes.'],
['Tu marca: cómo quieres que te vean',2,'Para que el contenido suene a ti y no a una plantilla.'],
['Dónde estás hoy en internet',3,'Para no empezar de cero y aprovechar lo que ya tienes.'],
['Cómo trabajaremos juntos',2,'Para que la colaboración sea cómoda desde el primer día.'],
['Último paso',1,'Ya casi está. Solo faltan un par de detalles y tu consentimiento para enviar las respuestas.']
];
// Preguntas: [fase, tipo (t texto, e email, l largo, c una opción, m varias), pregunta, ayuda, opciones, extras]
// extras: opt (opcional), req (obligatoria), max (máximo de opciones), otro (añade "Otro" con texto), ns (botón "No lo sé")
const Q=[
[0,'t','¿Cómo te llamas?'],
[0,'t','¿Cómo se llama tu empresa o proyecto?'],
[0,'e','¿Cuál es tu email?','Lo usaremos para enviarte el resumen y los próximos pasos.'],
[0,'t','¿Cuál es tu móvil?','Por si te resulta más cómodo que te escribamos por WhatsApp.',null,{opt:1}],
[1,'l','¿A qué se dedica tu negocio?','Cuéntanoslo como se lo explicarías a un amigo.',null,{ns:1}],
[1,'l','¿Qué producto o servicio te gustaría vender más?','',null,{ns:1}],
[1,'c','¿Cuánto tiempo lleva en marcha?','',['Menos de 1 año','De 1 a 3 años','De 3 a 10 años','Más de 10 años']],
[1,'c','¿Cuántas personas trabajáis en el negocio, contándote a ti?','',['Solo yo','De 2 a 5','De 6 a 20','Más de 20']],
[1,'l','¿Por qué te eligen a ti y no a otros?','No hace falta que sea perfecto.',null,{ns:1}],
[2,'m','¿Qué es lo más importante para ti el próximo año?','Elige hasta dos.',['Conseguir clientes nuevos','Vender más a los clientes que ya tengo','Que me conozcan y me reconozcan en mi sector','Que me vean como una marca premium','Lanzar un producto o servicio nuevo','Atraer buenos profesionales a mi equipo'],{max:2}],
[2,'m','¿Cómo notarás que va bien?','Elige las que quieras.',['Me llaman o escriben más personas','Vendo más','Más gente me conoce y me sigue','Más visitas o reservas','No lo sé, que me lo propongáis vosotros']],
[2,'l','Imagina que dentro de un año todo ha salido genial: ¿qué ha cambiado en tu negocio?','',null,{ns:1}],
[2,'c','¿Has hecho antes algo de marketing o de redes sociales?','',['Nunca','Sí, por mi cuenta','Sí, con mi equipo','Sí, con una agencia o un profesional']],
[2,'l','Si lo has probado, ¿qué funcionó y qué no?','',null,{opt:1}],
[3,'c','¿Qué rango de edad es el más habitual entre tus clientes, actuales o futuros?','',['Menos de 18','18-29','30-39','40-49','50-59','60 o más','Es muy variado']],
[3,'c','¿A quién van dirigidos principalmente tus productos o servicios?','',['Hombres','Mujeres','Ambos por igual']],
[3,'c','¿Vendes sobre todo a personas o a empresas?','',['Personas','Empresas','A las dos']],
[3,'m','¿De dónde son tus clientes?','Elige las que quieras.',['De mi ciudad o zona cercana','De todo el país','De varios países','Online']],
[3,'c','¿Cómo describirías el bolsillo de tu cliente típico?','',['Mira mucho el precio','Gasta con normalidad','Paga más por calidad y exclusividad']],
[3,'m','¿Por qué te compran?','Elige hasta tres.',['Les ahorro tiempo','Les ahorro dinero','Les doy tranquilidad y seguridad','Les doy prestigio','Les ayudo a ganar más dinero','Les ayudo a sentirse mejor'],{max:3,otro:1}],
[3,'m','¿Cuál puede ser un impedimento frecuente a la hora de adquirir tus productos o servicios?','Elige los que quieras.',['El precio','No me conocen y dudan','No tienen claro que lo necesiten','Comparan con otros','Tardan mucho en decidirse','No lo sé']],
[3,'m','¿Dónde pasan el tiempo?','Elige los que quieras.',['Instagram','Facebook','TikTok','LinkedIn','YouTube','WhatsApp','Google','Prensa, radio o TV','No lo sé']],
[3,'m','¿Cómo llegan hoy hasta ti?','Elige los que quieras.',['Por recomendación','Por redes sociales','Por Google o mi web','Por publicidad','En eventos o por contactos personales','No lo sé']],
[4,'m','¿Qué palabras describen mejor cómo quieres que te vea la gente?','Elige hasta tres.',['Cercana','Profesional','Exclusiva','Innovadora','De confianza','Divertida','Elegante','Familiar','Atrevida'],{max:3}],
[4,'c','¿Te ves cómodo/a apareciendo en vídeos y fotos?','',['Sí, sin problema','Un poco, si me guiáis','Prefiero no salir']],
[4,'c','¿Tienes logo, colores y fotos de tu negocio?','',['Sí, tengo todo','Tengo algo, pero incompleto','No, empezamos de cero']],
[5,'m','¿Dónde tienes presencia hoy?','Elige los que uses.',['Web','Instagram','TikTok','YouTube','LinkedIn','Facebook','Ficha de Google (la que sale en Google Maps)','Ninguno todavía']],
[5,'l','Pega los enlaces de tu web y redes, si los tienes','',null,{opt:1}],
[5,'c','¿Quién se encarga hoy de tus redes y de tu web?','',['Yo','Mi equipo','Una agencia o profesional externo','Nadie']],
[5,'l','¿Hay alguna marca o cuenta cuya forma de comunicar te guste?','De cualquier sector. Nos ayuda a entender tu gusto.',null,{opt:1}],
[5,'c','Además de crear contenido, se puede pagar para que llegue a más gente con anuncios en Instagram y Facebook (se llama Meta Ads). ¿Estás abierto a invertir en ello?','',['Sí, y ya sé cuánto quiero invertir','Sí, pero aún no sé cuánto invertir','No, solo quiero contenido orgánico (no anunciado)'],{req:1}],
[6,'t','¿Quién será nuestra persona de contacto y quién aprueba los contenidos?'],
[6,'m','¿Cómo prefieres que nos comuniquemos?','Elige las que quieras.',['Email','WhatsApp','Llamada','Reuniones periódicas presenciales']],
[6,'c','¿Qué nivel de implicación quieres tener en el proceso creativo?','Alto: opino en cada paso. Medio: veo las ideas importantes. Bajo: confío en vosotros y reviso el resultado final. En todos los niveles te consultaremos los resultados antes de publicarlos, salvo que nos indiques lo contrario.',['Alto','Medio','Bajo']],
[6,'l','¿Hay fechas importantes en los próximos meses, como lanzamientos, ferias o campañas?'],
[7,'l','¿Hay algo que te preocupe de empezar a trabajar con nosotros?'],
[7,'l','¿Algo más que debamos saber?'],
[7,'m','Antes de enviar, tu privacidad',
`<b>Responsable:</b> ${L.responsable} (${L.email}).<br><b>Finalidad:</b> gestionar tu solicitud, conocer tu negocio y preparar nuestra propuesta y la relación contigo como cliente.<br><b>Legitimación:</b> tu consentimiento y, si contratas nuestros servicios, la ejecución del contrato.<br><b>Destinatarios:</b> no cedemos tus datos a terceros salvo obligación legal. Usamos proveedores tecnológicos que los tratan por nuestra cuenta (por ejemplo, Google y nuestro CRM).<br><b>Derechos:</b> puedes acceder, rectificar, suprimir, oponerte, limitar el tratamiento y pedir la portabilidad escribiendo a ${L.email}. También puedes reclamar ante la Agencia Española de Protección de Datos (aepd.es).${L.politicaUrl?`<br><a href="${L.politicaUrl}" target="_blank" rel="noopener">Leer la política de privacidad completa</a>`:''}`,
['He leído la información sobre privacidad y acepto el tratamiento de mis datos'],{req:1,cs:1}]
].map(([f,t,q,h,o,x])=>({f,t,q,h,o,...x}));

const N=Q.length,steps=[];
Q.forEach((x,k)=>{if(!k||Q[k-1].f!=x.f)steps.push({f:x.f});steps.push({k})});
const T=steps.length;
let i=-1,tm,A={},O={},saved=null;
try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!saved||!(saved.i>0))saved=null;

const $=s=>document.querySelector(s),st=$('#stage');
const wrap=(c,b)=>`<div class="q${b?' back':''}">${c}</div>`;
const opts=x=>x.o?(x.otro?[...x.o,'Otro']:x.o):null;
const isQ=s=>'k' in s;
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,O,i}))}catch(e){}};
$('#brand').textContent=CONFIG.agency;

function go(n,b){
  clearTimeout(tm);clearInterval(rotT);i=n;
  $('#bar').style.width=Math.max(n,0)/T*100+'%';
  const s=steps[n];
  $('#cnt').textContent=s?`Fase ${(isQ(s)?Q[s.k].f:s.f)+1} de ${P.length}`:'';
  if(n<0)return welcome(b);
  if(n>=T)return thanks();
  store();
  isQ(s)?ask(s.k,b):intro(s.f,b);
}

let rotT;
function startRot(){
  const w=[...document.querySelectorAll('.rw')];
  if(w.length<2||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let k=0;
  rotT=setInterval(()=>{
    const a=w[k];k=(k+1)%w.length;const b=w[k];
    a.classList.remove('on');a.classList.add('out');
    b.classList.add('on');
    setTimeout(()=>a.classList.remove('out'),600);
  },2000);
}

function welcome(b){
  st.innerHTML=wrap(`${art('welcome','👋')}<h1>15 minutos para empezar a ganar <span class="rot">${PALABRAS.map((w,k)=>`<span class="rw${k?'':' on'}">${w}</span>`).join('')}</span></h1><p class="hint">Son ${N-1} preguntas en ${P.length} fases cortas. Contesta con calma: con tus respuestas nos encargamos de la estrategia, el contenido y la publicación.</p><p class="hint">Puedes volver atrás cuando quieras con el botón Atrás. Tu progreso se guarda en este dispositivo: si te interrumpen, abre de nuevo este enlace y sigue donde lo dejaste.</p><div class="row"><button class="btn" id="ok">${saved?'Continuar donde lo dejé':'Empezar'}</button>${saved?'<button class="ghost" id="fresh">Empezar de nuevo</button>':''}</div>`,b);
  $('#ok').onclick=next;
  startRot();
  if(saved)$('#fresh').onclick=()=>{saved=null;A={};O={};try{localStorage.removeItem(KEY)}catch(e){}go(0)};
}

function intro(f,b){
  const c=Q.filter(x=>x.f==f).length;
  st.innerHTML=wrap(`${f>0&&!b?`<div class="done">✓ Fase ${f} completada</div>`:''}${art(f,E[f])}<div class="sec">Fase ${f+1} de ${P.length}</div><h1>${P[f][0]}</h1><p class="hint">${P[f][2]}</p><p class="hint">${c} ${c==1?'pregunta':'preguntas'}, unos ${P[f][1]} min</p><div class="row"><button class="ghost" id="bk">Atrás</button><button class="btn" id="ok">Continuar</button></div>`,b);
  $('#ok').onclick=next;$('#bk').onclick=back;
  st.firstElementChild.classList.add('intro');
}

function ask(k,b){
  const x=Q[k],v=A[k],op=opts(x),rq=x.req||(x.f<=3&&!x.opt);
  const on=o=>x.t=='m'?(v||[]).includes(o):v===o;
  const f=op
    ?`<div class="opts">${op.map((o,j)=>`<button class="opt${on(o)?' on':''}" data-k="${j}" style="--d:${j}"><kbd>${'ABCDEFGHIJ'[j]}</kbd>${o}</button>`).join('')}</div>${x.otro?`<input id="oth" placeholder="Escribe cuál" autocomplete="off"${on('Otro')?'':' hidden'}>`:''}`
    :x.t=='l'?'<textarea rows="2" placeholder="Escribe aquí"></textarea>'
    :`<input type="${x.t=='e'?'email':'text'}" placeholder="Escribe aquí" autocomplete="off">`;
  const hk=x.cs?'Marca esta casilla para poder enviar':x.t=='c'?'Elige una opción':x.t=='m'?'Elige las que quieras':x.t=='l'?'Shift + Enter para un salto de línea':'Pulsa Enter';
  const last=k==N-1;
  st.innerHTML=wrap(`<div class="sec">${P[x.f][0]}${rq?'':'<span class="opt-tag">Opcional</span>'}</div><h2>${x.q}</h2><p class="hint">${x.h||''}</p>${f}<div class="err" role="alert"></div><div class="row"><button class="ghost" id="bk">Atrás</button><button class="btn" id="ok">${last?'Enviar respuestas':'Siguiente'}</button>${x.ns?'<button class="ghost" id="ns">No lo sé, lo hablamos en la reunión</button>':''}<span class="hk">${hk}</span></div>`,b);
  $('#ok').onclick=next;$('#bk').onclick=back;
  if(x.ns)$('#ns').onclick=()=>{A[k]='No lo sé, lo hablamos en la reunión';next()};
  st.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>pick(+btn.dataset.k));
  const oth=$('#oth');
  if(oth){oth.value=O[k]||'';oth.oninput=()=>O[k]=oth.value}
  const el=st.querySelector('input:not(#oth),textarea');
  if(el){
    el.value=v||'';
    el.oninput=()=>{A[k]=el.value;if(el.tagName=='TEXTAREA'){el.style.height='auto';el.style.height=el.scrollHeight+'px'}};
    el.focus({preventScroll:true});
    if(el.tagName=='TEXTAREA')el.oninput();
  }
}

function pick(j){
  const k=steps[i].k,x=Q[k],o=opts(x)[j],e=$('.err');e.textContent='';
  if(x.t=='m'){
    const a=A[k]=A[k]||[],p=a.indexOf(o);
    if(p<0){if(x.max&&a.length>=x.max){e.textContent=`Puedes elegir hasta ${x.max}.`;return}a.push(o)}else a.splice(p,1);
  }else A[k]=o;
  st.querySelectorAll('.opt').forEach((btn,q)=>{const z=opts(x)[q];btn.classList.toggle('on',x.t=='m'?A[k].includes(z):A[k]===z)});
  const oth=$('#oth');
  if(oth){oth.hidden=!(A[k]||[]).includes('Otro')}
  if(oth&&!oth.hidden)oth.focus();else if(document.activeElement)document.activeElement.blur();
  if(x.t=='c')tm=setTimeout(next,350);
}

function next(){
  if(i<0){const s=saved;saved=null;if(s){A=s.A||{};O=s.O||{};return go(s.i)}return go(0)}
  if(i>=T)return;
  const s=steps[i];
  if(!isQ(s))return go(i+1);
  const k=s.k,x=Q[k],v=A[k],e=$('.err'),rq=x.req||(x.f<=3&&!x.opt);
  const empty=!v||!v.length||(typeof v=='string'&&!v.trim());
  if(rq&&empty){e.textContent=x.cs?'Necesitamos tu consentimiento para poder enviar tus respuestas.':'Esta pregunta es obligatoria.';return}
  if(Array.isArray(v)&&v.includes('Otro')&&!(O[k]||'').trim()){e.textContent='Escribe cuál es ese otro.';return}
  if(x.t=='e'&&!/^\S+@\S+\.\S+$/.test(v||'')){e.textContent='Revisa el email: parece que le falta algo.';return}
  i+1<T?go(i+1):send();
}

function back(){
  let n=i-1;
  if(n>=0&&!isQ(steps[n])&&isQ(steps[i]))n--;
  go(n,1);
}

function ans(k){
  const v=A[k];
  return Array.isArray(v)?v.map(s=>s=='Otro'?'Otro: '+(O[k]||''):s).join(', '):(v||'');
}

async function send(){
  st.innerHTML=wrap('<h2>Enviando tus respuestas…</h2>');
  const p={agencia:CONFIG.agency,fecha:new Date().toISOString(),respuestas:Q.map((x,k)=>({seccion:P[x.f][0],pregunta:x.q,respuesta:ans(k)}))};
  try{
    if(CONFIG.endpoint)await fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});
    else console.log(p);
    try{localStorage.removeItem(KEY)}catch(e){}
    go(T);
  }catch(err){
    st.innerHTML=wrap('<h2>No hemos podido enviar tus respuestas</h2><p class="hint">Sigue aquí tu información. Comprueba tu conexión e inténtalo de nuevo.</p><div class="row"><button class="btn" id="retry">Reintentar</button></div>');
    $('#retry').onclick=send;
  }
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:5';
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext('2d'),col=['#FFD84D','#ffffff','#FF7A9C','#7CF2D0','#9AA7FF'];
  const p=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:5+Math.random()*7,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,a:Math.random()*6,c:col[Math.random()*col.length|0]}));
  let t=0;
  (function f(){
    g.clearRect(0,0,c.width,c.height);
    p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;g.save();g.translate(q.x,q.y);g.rotate(q.a);g.fillStyle=q.c;g.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);g.restore()});
    if(++t<260)requestAnimationFrame(f);else c.remove();
  })();
}

function thanks(){
  confetti();
  st.innerHTML=wrap(`${art('thanks','🎉')}<h1>¡Genial, ya tenemos lo suficiente para empezar a diseñar tu estrategia ganadora!</h1><p class="hint">Nos pondremos en contacto contigo en menos de 48 horas para terminar de ajustar los datos y definir las fechas de grabación.</p>${CONFIG.endpoint?'':'<p class="hint">Modo de prueba: las respuestas aún no se envían a ningún sitio.</p>'}`);
}

document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(e.key=='Enter'&&t!='BUTTON'&&!(e.shiftKey&&t=='TEXTAREA')){e.preventDefault();if(i<T)next()}
  else if(i>=0&&i<T&&isQ(steps[i])&&opts(Q[steps[i].k])&&t!='INPUT'&&t!='TEXTAREA'&&!e.ctrlKey&&!e.metaKey&&e.key.length==1){
    const j='abcdefghij'.indexOf(e.key.toLowerCase());
    if(j>=0&&j<opts(Q[steps[i].k]).length)pick(j);
  }
});
go(-1);
